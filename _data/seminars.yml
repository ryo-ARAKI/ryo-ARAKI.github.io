- title: "有向浸透現象におけるレニーエントロピー"
  speaker: "原田 健自"
  affiliation: "京都大学 情報学研究科 助教"
  date: "2026-02-19"
  date_label: "2026年2月19日（木）"
  time: "10:30--11:30"
  place: "東京理科大学 野田キャンパス 7404教室"
  abstract: |-
    感染症の伝搬や乱流などを記述する確率過程の時間発展は、時間方向を浸透方向として捉えることで、有向浸透現象[1]として対応づけられる。
    とくに、有向浸透現象における活動相と非活動相の間の吸収状態相転移は、臨界現象として普遍性を示すと考えられており、これまで多くの関心を集めてきた。

    本講演では、(1+1)次元の有向浸透現象に対して数値的に評価した情報量（レニーエントロピー）について報告する[2]。
    非平衡臨界点における臨界緩和の振る舞い、および活動相におけるカスプ構造を中心に紹介する。
    あわせて、計算に用いた数値手法としてテンソルネットワーク法の概要も述べる。
  references:
    - text: "M. Henkel, H. Hinrichsen, and S. Lübeck, Non-Equilibrium Phase Transitions (Springer, New York, 2008), Vol. 1."
    - text: "K. Harada and N. Kawashima, Entropy Governed by the Absorbing State of Directed Percolation, Physical Review Letters 123, 090601 (2019)."
      url: "https://doi.org/10.1103/PhysRevLett.123.090601"

- title: "古典多体系における動的低ランク近似法"
  speaker: "皆川 諒"
  affiliation: "京都大学 情報学研究科 M2"
  date: "2026-02-19"
  date_label: "2026年2月19日（木）"
  time: "11:30--12:30"
  place: "東京理科大学 野田キャンパス 7404教室"
  abstract: |-
    近年，非平衡定常状態だけでなく，非平衡多体系のダイナミクスの研究が盛んである．
    特に，エンタングルメントエントロピーや相互情報量など，多体系の波動関数や確率分布の情報論的側面に関する研究が注目を集めている．
    しかし，波動関数や確率分布の自由度は系の大きさに対して指数的に増大するため，直接的なシミュレーションは難しい．

    一方で，応用数学分野では時間発展方程式の動的低ランク近似法と呼ばれる時間発展方程式の近似解法の研究が最近，活発に行われており，新たな近似計算法として注目されているが，多体系への応用はほとんど行われていない．

    本講演では，動的低ランク近似をテンソルネットワーク表現に組み込み，1 次元動的イジングモデル，及び1次元Contact Processに適用する事により，動的低ランク近似法の古典多体系に対する有効性の検証を行った結果を報告する．
- title: "Julia言語によるマルチプラットフォーム対応 分散混相流ソルバ LCS.jl の開発"
  speaker: "富永 健斗"
  affiliation: "東京科学大学 大学院工学院 機械系 D1"
  date: "2026-06-17"
  date_label: "2026年6月17日（水）"
  time: "11:00--12:00"
  place: "東京理科大学 野田キャンパス 7407教室"
  abstract: |-
    近年，高性能計算分野 (high performance computing; HPC) では，CPUに加えてGPUを搭載したスーパーコンピュータが主流になりつつある．
    これに伴い，CPU環境を前提として最適化されてきたHPCコードを，GPU環境へ移植する必要性が高まっている．
    このような移植では，いまだ広く利用されるCPU環境への対応を維持しつつ，多様なベンダーのGPU環境にも対応できる性能可搬性が求められる．
    さらに，GPUの性能を引き出すため，メモリ階層や並列実行を考慮したアルゴリズムの再設計が必要となる．
    性能可搬性と高性能を両立するHPCコード開発手法の確立は，依然として重要な課題である．

    そこで，我々は，Julia言語と `KernelAbstractions.jl` を用いて，単一のソースコードをCPU/GPU上で実行可能なsingle-source，multi-platform designに基づく混相乱流計算ソルバーLagrangian Cloud Simulator in Julia (`LCS.jl`) を開発した．
    `LCS.jl` では，従来のCPU向け逐次粒子通信アルゴリズムを，prefix-scanに基づくGPU-nativeな並列アルゴリズムへと再設計した．
    これにより，粒子通信コストを全実行時間の約78%から約10%まで削減した．
    さらに `LCS.jl` は，Fortran実装と同等のCPU性能，および256 H100 GPUsまで85%以上のstrong scaling効率を達成した．GPU計算では，CPU計算に対して最大18.0倍の高速化を達成した．

    本講演では，これらの学術的成果に加えて，`LCS.jl` の開発を通じて得られたJulia言語によるHPCコードの設計手法についても紹介する．
    Julia言語を用いることで，C/Fortranに匹敵する実行性能を目指しつつ，高水準な言語機能を活かした抽象化により，実行環境や機能の違いを局所化した拡張可能なコードを高い生産性で開発できる．
    さらに，ドキュメント生成，テスト，ベンチマークを開発過程に組み込むことで，HPCコードの堅牢性と保守性を高められる．
    これらを通じて，性能可搬性，高性能，高生産性を同時に追求するHPCコード開発手法について議論する．
  references:
    - text: "Taketo Tominaga and Ryo Onishi, LCS.jl: A High-Performance, Multi-Platform Computational Model in Julia for Turbulent Particle-Laden Flows, arXiv:2604.11008 (2026)."
      url: "https://arxiv.org/abs/2604.11008"
    - text: "Taketo Tominaga and Ryo Onishi, Finite-Time Relaxation of Inertial Particle Clustering in Non-Equilibrium Turbulence, arXiv:2605.25539 (2026)."
      url: "https://arxiv.org/abs/2605.25539"
- title: "データ駆動型方程式探索のための対称性に基づく候補項フィルタリング"
  speaker: "横倉 淳也"
  affiliation: "東京大学 理学系研究科 M2"
  date: "2026-07-03"
  date_label: "2026年7月3日（金）"
  time: "11:00--12:00"
  place: "東京理科大学 神楽坂キャンパス 353教室+オンライン"
  abstract: |-
    データ駆動による支配方程式推定において、対称性を考慮することは、非物理的な推定結果の抑制やノイズ耐性の向上といった効果のある重要な要素である。
    しかし従来手法では、手作業による候補項の選別[1]や、推定過程での反復的な対称性の付与[2]などが主なアプローチであり、高次・高階系への適用や計算量の観点で課題があった。
    本発表では、探索空間に対して対称性を満たす部分空間を事前に構成する手法を提案する[3]。
    対称変換を探索空間上の線形作用として定式化し、離散・連続対称性および不変・共変条件を統一的に線形方程式として表現することで、対称性を満たす項の集合を体系的に抽出する。
    これにより探索空間そのものを自動的に制約でき、既存のデータ駆動型推定手法の前処理として自然な統合が可能である。
    提案手法をToner--Tu系およびKardar--Parisi--Zhang方程式に適用し、既知の支配方程式の再現と高次項の抽出における有効性を確認した。
    さらに、本手法を実装したライブラリを公開しており、簡単なハンズオンを通じてその使用方法も紹介する。
  references:
    - text: "D. R. Gurevich et al., _J. Fluid Mech._ *996*, A25 (2024)."
      url: "https://doi.org/10.1017/jfm.2024.813"
    - text: "G. E. Karniadakis et al., _Nat. Rev. Phys._ *3*, 422--440 (2021)."
      url: "https://doi.org/10.1038/s42254-021-00314-5"
    - text: "J. Yokokura and K. A. Takeuchi, arXiv:2604.01592 (2026)."
      url: "https://arxiv.org/abs/2604.01592"
    - text: "apoblast"
      url: "https://github.com/JyJyJcr/apoblast"
    - text: "apoblast-handson"
      url: "https://github.com/JyJyJcr/apoblast-handson"
